<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Denník</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denník">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f1f5ff;--card:#fff;--ink:#0d1320;--mut:#6b7587;--line:#dbe3f3;--acc:#1f7ae0;--soft:#e3eefc;--hd:#0b1220;--ok:#1d9a6c;--warn:#f0a23a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a;--card:#131b2b;--ink:#e8edf7;--mut:#8f9bb2;--line:#243049;--soft:#1a2a45;--hd:#060a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1a;--card:#131b2b;--ink:#e8edf7;--mut:#8f9bb2;--line:#243049;--soft:#1a2a45;--hd:#060a12;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;min-height:100vh}
header{background:var(--hd);color:#fff;padding:22px 20px 22px;position:relative}
header .w{max-width:720px;margin:0 auto}
.ey{color:#3b8bf0;font-size:.7rem;font-weight:700;letter-spacing:.08em}
header h1{margin:2px 0 0;font-size:1.9rem;line-height:1.15;padding-right:50px}
header p{margin:6px 0 0;color:#aab6cc}
#prof{position:absolute;right:max(20px,calc(50% - 340px));top:22px;width:36px;height:36px;border-radius:8px;border:0;background:#1a2230;color:#fff;font-size:1rem;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:18px 20px 120px}
h2{font-size:1.15rem;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mut);font-size:.8rem}
h3{font-size:.75rem;color:var(--acc);margin:16px 0 8px;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:1.1rem}.st span{color:var(--mut);font-size:.8rem}
.st.dk{background:var(--hd);color:#fff;border-color:var(--hd)}.st.dk span{color:#aab6cc}
.card{background:var(--card);border:1px solid var(--line);border-bottom:2px solid #4c97e8;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.ic{width:36px;height:36px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex:none}
.card .bd{flex:1;min-width:0}.card .tt{font-weight:700}.card .tx{color:var(--mut);overflow-wrap:anywhere}
.tm{color:var(--mut);font-size:.82rem;font-weight:600;align-self:flex-start}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.task .r{display:flex;gap:10px;align-items:center}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.task.d .nm{text-decoration:line-through;color:var(--mut)}
.nm{font-weight:700}.sm{color:var(--acc);font-size:.82rem;margin:2px 0 0 32px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 32px}
.chip{border:0;background:var(--soft);color:var(--acc);font:inherit;font-size:.82rem;font-weight:600;border-radius:8px;padding:7px 11px;cursor:pointer}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.ab small{color:var(--mut)}.ab .v{font-size:1.7rem;font-weight:700;margin:4px 0}
.ab button{border:0;background:none;color:var(--acc);font:inherit;font-weight:600;padding:0;cursor:pointer}
.live{color:var(--ok);font-weight:600;font-size:.82rem;margin:12px 0}
.mn{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}
.mn button{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:8px;font-size:1.1rem;cursor:pointer}
.bal{background:var(--hd);color:#fff;border-radius:10px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.bal small{color:#aab6cc;display:block}.bal b{font-size:1.4rem;color:#3ddc97}.bal b.neg{color:#ff8a80}
.ar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;cursor:pointer}
.dh{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:20px 0 12px}
.dh .ic{background:var(--acc);color:#fff}.dh small{color:var(--acc);font-weight:700;font-size:.7rem;display:block;letter-spacing:.06em}
.dh .n{margin-left:auto;background:var(--soft);color:var(--acc);font-weight:700;font-size:.8rem;border-radius:6px;padding:2px 8px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
#q{margin-bottom:6px}
.empty{color:var(--mut);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:10px}
#fab{position:fixed;right:max(18px,calc(50% - 360px + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 16px rgba(31,122,224,.4);cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 2px 9px;border:0;background:none;color:var(--mut);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;display:grid;gap:2px;justify-items:center}
nav button span{font-size:1.25rem}nav button[aria-selected="true"]{color:var(--acc)}
#ov{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:85vh;max-height:85dvh;overflow:auto;overscroll-behavior:contain}
#sh h4{margin:0;font-size:1.1rem}#sh label{display:grid;gap:4px;font-size:.82rem;color:var(--mut)}
.br{display:flex;gap:10px}.br button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.br .p{background:var(--acc);border-color:var(--acc);color:#fff}.br .x{color:#d33}
.clk{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.clk b{font-size:2.2rem;text-align:center;color:var(--ink);letter-spacing:.04em}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--hd);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#ts.on{opacity:1}
.clk input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);height:34px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><div class="w"><div class="ey" id="ey"></div><h1 id="h1"></h1><p id="hp"></p></div><button id="prof" aria-label="Profil">☺</button></header>
<main id="v"></main>
<button id="fab" aria-label="Pridať">+</button>
<nav id="nav"></nav>
<div id="ts" role="status"></div>
<div id="ov"><div id="sh"></div></div>
<script>
const KEY="denník-v1";
let S={name:"",recs:[],tasks:[],notes:[],att:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const D=s=>new Date(s+"T00:00");
const nowT=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wd=s=>D(s).toLocaleDateString("sk-SK",{weekday:"long"});
const short=s=>wd(s)+" "+D(s).getDate()+". "+(D(s).getMonth()+1)+".";
const long=s=>D(s).getDate()+". "+D(s).toLocaleDateString("sk-SK",{month:"long",year:"numeric"});
const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const hh=m=>{const s=m<0?"-":"";m=Math.abs(m);return s+Math.floor(m/60)+":"+pad(m%60)+" h"};
const TODAY=()=>ymd(new Date());
let tab="dnes",mon=new Date();mon.setDate(1);
const TABS=[["dnes","Dnes","▦"],["ulohy","Úlohy","☑"],["postrehy","Postrehy","✦"],["dochadzka","Dochádzka","◔"],["archiv","Archív","▣"]];
$("nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join("");

function modal(title,fields,onSave,onDel){
const sh=$("sh");
sh.innerHTML=`<h4>${esc(title)}</h4>`+fields.map(f=>{
const v=esc(f.v==null?"":f.v);let c;
if(f.t==="select")c=`<select name="${f.k}">${f.o.map(o=>`<option ${o===f.v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
else if(f.t==="area")c=`<textarea name="${f.k}" rows="3">${v}</textarea>`;
else if(f.t==="clock"){const[h,mi]=(f.v||"00:00").split(":");return `<label>${esc(f.l)}<div class="clk"><b id="cd">${pad(+h)}:${pad(+mi)}</b><span>Hodiny</span><input type="range" min="0" max="23" value="${+h}" data-c="h"><span>Minúty</span><input type="range" min="0" max="59" value="${+mi}" data-c="m"></div></label>`}
else if(f.t==="check")return `<label style="grid-auto-flow:column;justify-content:start;gap:8px;align-items:center"><input type="checkbox" name="${f.k}" style="width:20px;height:20px" ${f.v?"checked":""}>${esc(f.l)}</label>`;
else c=`<input name="${f.k}" type="${f.t||"text"}" value="${v}" ${f.u?'data-u="1" autocapitalize="characters" autocomplete="off"':""} ${f.p?`placeholder="${esc(f.p)}"`:""}>`;
return `<label>${esc(f.l)}${c}</label>`}).join("")+
`<div class="br">${onDel?'<button class="x" id="md">Zmazať</button>':""}<button id="mc">Zrušiť</button><button class="p" id="ms">Uložiť</button></div>`;
$("ov").classList.add("on");document.documentElement.classList.add("lock");
const cu=()=>{const r=sh.querySelectorAll("[data-c]");if(r.length)$("cd").textContent=pad(r[0].value)+":"+pad(r[1].value)};
sh.querySelectorAll("[data-c]").forEach(r=>r.oninput=cu);
sh.querySelectorAll("[data-u]").forEach(i=>i.oninput=()=>{i.value=i.value.toUpperCase().replace(/[^\p{Lu}0-9 ]/gu,"")});
const get=()=>{const o={};fields.forEach(f=>{if(f.t==="clock"){o[f.k]=pad(sh.querySelector('[data-c="h"]').value)+":"+pad(sh.querySelector('[data-c="m"]').value);return}const e=sh.querySelector(`[name="${f.k}"]`);o[f.k]=f.t==="check"?e.checked:e.value.trim()});return o};
$("mc").onclick=close;
$("ms").onclick=()=>{onSave(get());save();close();render()};
if(onDel)$("md").onclick=()=>{onDel();save();close();render()};
}
function close(){$("ov").classList.remove("on");document.documentElement.classList.remove("lock")}
$("ov").onclick=e=>{if(e.target.id==="ov")close()};

const storeOpts=()=>[...new Set(S.recs.map(r=>r.store))];
function recForm(r){
const dl=storeOpts();
modal(r?"Upraviť záznam":"Nový záznam",[
{k:"store",l:"Predajňa",v:r?r.store:"",p:"napr. 110 MT",u:true},
{k:"text",l:"Činnosť",t:"area",v:r?r.text:""},
{k:"time",l:"Čas",t:"clock",v:r?r.time:nowT()}],
o=>{if(!o.store&&!o.text)return;if(r)Object.assign(r,o);else S.recs.push({id:uid(),date:TODAY(),...o})},
r?()=>{S.recs=S.recs.filter(x=>x!==r)}:null);
}
function taskForm(t){
modal(t?"Upraviť úlohu":"Nová úloha",[
{k:"title",l:"Názov",v:t?t.title:""},
{k:"prio",l:"Priorita",t:"select",o:["Bežná","Vysoká"],v:t?t.prio:"Bežná"},
{k:"date",l:"Deň",t:"date",v:t?t.date:TODAY()}],
o=>{if(!o.title)return;if(t)Object.assign(t,o);else S.tasks.push({id:uid(),done:false,...o})},
t?()=>{S.tasks=S.tasks.filter(x=>x!==t)}:null);
}
function noteForm(n){
modal(n?"Upraviť postreh":"Nový postreh",[{k:"text",l:"Postreh",t:"area",v:n?n.text:""}],
o=>{if(!o.text)return;if(n)n.text=o.text;else S.notes.push({id:uid(),date:TODAY(),text:o.text})},
n?()=>{S.notes=S.notes.filter(x=>x!==n)}:null);
}
function attForm(date,rec){
modal("Dochádzka",[
{k:"date",l:"Dátum",t:"date",v:date||TODAY()},
{k:"in",l:"Príchod",t:"time",v:rec?rec.in:""},
{k:"out",l:"Odchod",t:"time",v:rec?rec.out:""},
{k:"off",l:"Voľno (počíta sa ako 8 h)",t:"check",v:rec?rec.off:false}],
o=>{if(date&&date!==o.date)delete S.att[date];S.att[o.date]={in:o.in,out:o.out,off:o.off}},
rec?()=>{delete S.att[date]}:null);
}

function recCard(r){return `<div class="card" data-a="rec" data-id="${r.id}"><div class="ic">⌂</div><div class="bd"><div class="tt">${esc(r.store||"—")}</div><div class="tx">${esc(r.text)}</div></div><div class="tm">◷ ${esc(r.time)}</div></div>`}
function workedMin(d){const a=S.att[d];if(!a)return 0;if(a.off)return 480;if(!a.in)return 0;
const end=a.out||(d===TODAY()?nowT():"");return end?Math.max(0,mins(end)-mins(a.in)):0}

function render(){
document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
const v=$("v"),T=TODAY();let ey,h1,hp="";
if(tab==="dnes"){
ey="DENNÍK";h1="Ahoj"+(S.name?", "+esc(S.name):"");
const rs=S.recs.filter(r=>r.date===T).sort((a,b)=>a.time.localeCompare(b.time));
const ts=S.tasks.filter(t=>t.date===T),dn=ts.filter(t=>t.done).length;
v.innerHTML=`<h2 style="font-size:1.6rem;margin:0">${cap(wd(T))} ${new Date().getDate()}. ${new Date().getMonth()+1}.</h2><p style="color:var(--mut);margin:2px 0 14px">Čo ste dnes vybavili?</p>
<div class="stats"><div class="st"><b>${hh(workedMin(T))}</b><span>Odpracované</span></div><div class="st"><b>${dn}/${ts.length}</b><span>Úlohy dnes</span></div><div class="st"><b>${rs.length}</b><span>Záznamy</span></div></div>
<h2>Dnešné záznamy <small>${rs.length} záznamov</small></h2>${rs.length?rs.map(recCard).join(""):'<div class="empty">Zatiaľ nič. Klepnite na + a pridajte prvý záznam.</div>'}`;
}else if(tab==="ulohy"){
ey="PLÁNOVANIE";h1="Úlohy";hp="Plánujte na ľubovoľný deň a majte prehľad.";
const op=S.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)),dn=S.tasks.filter(t=>t.done).sort((a,b)=>b.date.localeCompare(a.date));
let last="",o="";
op.forEach(t=>{if(t.date!==last){last=t.date;o+=`<h3>${short(t.date).toUpperCase()}</h3>`}
o+=`<div class="task"><div class="r"><input type="checkbox" data-a="chk" data-id="${t.id}"><span class="nm" data-a="task" data-id="${t.id}">${esc(t.title)}</span></div><div class="sm">${t.prio} · ${short(t.date)}</div>
<div class="acts"><button class="chip" data-a="today" data-id="${t.id}">Presunúť na dnes</button><button class="chip" data-a="plus" data-id="${t.id}">Posunúť o deň</button><button class="chip" data-a="pick" data-id="${t.id}">Vybrať deň…</button></div></div>`});
v.innerHTML=`<h2>Otvorené (${op.length})</h2>${o||'<div class="empty">Žiadne otvorené úlohy.</div>'}<h2>Hotové (${dn.length})</h2>`+
dn.map(t=>`<div class="task d"><div class="r"><input type="checkbox" checked data-a="chk" data-id="${t.id}"><span class="nm" data-a="task" data-id="${t.id}">${esc(t.title)}</span></div><div class="sm">${t.prio} · ${short(t.date)}</div></div>`).join("");
}else if(tab==="postrehy"){
ey="NOTES";h1="Postrehy";hp="Nápady, problémy a veci, na ktoré netreba zabudnúť.";
const ns=[...S.notes].sort((a,b)=>b.date.localeCompare(a.date));
v.innerHTML=ns.length?ns.map(n=>`<div class="card" data-a="note" data-id="${n.id}"><div class="ic">✦</div><div class="bd"><div class="tx" style="color:var(--ink)">${esc(n.text)}</div></div><div class="tm">${short(n.date)}</div></div>`).join(""):'<div class="empty">Zatiaľ žiadne postrehy. Klepnite na + a zapíšte prvý.</div>';
}else if(tab==="dochadzka"){
ey="PRACOVNÝ ČAS";h1="Dochádzka";hp="Zapíšte príchod ráno a odchod popoludní.";
const a=S.att[T]||{};
const y=mon.getFullYear(),m=mon.getMonth(),pre=y+"-"+pad(m+1);
const ds=Object.keys(S.att).filter(d=>d.startsWith(pre)).sort().reverse();
const work=ds.filter(d=>!S.att[d].off&&S.att[d].in).length,off=ds.filter(d=>S.att[d].off).length;
const tot=ds.reduce((s,d)=>s+workedMin(d),0);
const end=new Date(y,m+1,0).getDate(),cur=new Date();
const lim=(cur.getFullYear()===y&&cur.getMonth()===m)?cur.getDate():(new Date(y,m,1)<cur?end:0);
let nd=0;for(let i=1;i<=lim;i++){const g=new Date(y,m,i).getDay();if(g&&g<6)nd++}
const bal=tot-nd*480;
v.innerHTML=`<p style="color:var(--mut);font-weight:600">Dnes · ${wd(T)} ${new Date().getDate()}. ${new Date().getMonth()+1}.</p>
<div class="big"><div class="ab"><small>Príchod</small><div class="v">${a.in||"--:--"}</div><button data-a="in">${a.in?"Upraviť":"Zapísať čas"}</button></div>
<div class="ab"><small>Odchod</small><div class="v">${a.out||"--:--"}</div><button data-a="out">${a.out?"Upraviť":"Zapísať čas"}</button></div></div>
${a.in&&!a.out?`<div class="live">● Pracujete od ${a.in} · dnes ${hh(workedMin(T))}</div>`:""}
<div class="mn"><button data-a="mp">‹</button><b style="font-size:1.1rem">${cap(mon.toLocaleDateString("sk-SK",{month:"long",year:"numeric"}))}</b><button data-a="mn">›</button></div>
<div class="stats"><div class="st dk"><b>${work}</b><span>Pracovných dní</span></div><div class="st dk"><b>${off}</b><span>Dní voľna</span></div><div class="st dk"><b>${hh(tot)}</b><span>Odpracované spolu</span></div></div>
<div class="bal"><div><small>Bilancia voči norme</small><small>Norma 8 h za každý pracovný deň (${nd} dní). Voľno sa počíta ako odpracované.</small></div><b class="${bal<0?"neg":""}">${bal>0?"+":""}${hh(bal)}</b></div>
<h2>Záznamy dochádzky <small><button class="chip" data-a="xls">Export Excel</button> <button class="chip" data-a="mail">E-mail</button> <button class="chip" data-a="addatt">+ Pridať</button></small></h2>
${ds.length?ds.map(d=>{const r=S.att[d];return `<div class="ar" data-a="att" data-d="${d}"><div><b>${short(d)}</b><div style="color:var(--mut);font-size:.85rem">${r.off?"voľno":(r.in||"--:--")+" – "+(r.out||"--:--")}</div></div><b>${hh(workedMin(d))}</b></div>`}).join(""):'<div class="empty">V tomto mesiaci nie sú žiadne záznamy.</div>'}`;
}else{
ey="SPÄŤ V ČASE";h1="Archív práce";hp="Každý zásah, každá predajňa, prehľadne podľa dní.";
const q=(window._q||"").toLowerCase();
const rs=S.recs.filter(r=>!q||(r.store+" "+r.text).toLowerCase().includes(q)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const days=[...new Set(rs.map(r=>r.date))];
v.innerHTML=`<input id="q" type="search" placeholder="Hľadať predajňu alebo činnosť" value="${esc(window._q||"")}">`+(days.length?days.map(d=>`<div class="dh"><div class="ic">▦</div><div><small>${wd(d).toUpperCase()}</small><b>${long(d)}</b></div><span class="n">${rs.filter(r=>r.date===d).length}</span></div>`+rs.filter(r=>r.date===d).map(recCard).join("")).join(""):'<div class="empty">Nič sa nenašlo.</div>');
const qi=$("q");qi.oninput=()=>{window._q=qi.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
}
$("ey").textContent=ey;$("h1").innerHTML=h1;$("hp").textContent=hp;$("hp").style.display=hp?"block":"none";
$("fab").style.display=tab==="dochadzka"?"none":"block";
}

document.addEventListener("click",e=>{
const b=e.target.closest("[data-a],[data-t]");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;scrollTo(0,0);render();return}
const a=b.dataset.a,id=b.dataset.id,T=TODAY();
const task=S.tasks.find(x=>x.id===id);
if(a==="rec")recForm(S.recs.find(x=>x.id===id));
else if(a==="note")noteForm(S.notes.find(x=>x.id===id));
else if(a==="task")taskForm(task);
else if(a==="chk"){task.done=!task.done;save();render()}
else if(a==="today"){task.date=T;save();render()}
else if(a==="plus"){const d=D(task.date);d.setDate(d.getDate()+1);task.date=ymd(d);save();render()}
else if(a==="pick")modal("Vybrať deň",[{k:"date",l:"Deň",t:"date",v:task.date}],o=>{if(o.date)task.date=o.date});
else if(a==="in"||a==="out"){const r=S.att[T]||{in:"",out:"",off:false};modal(a==="in"?"Príchod":"Odchod",[{k:"t",l:"Čas",t:"clock",v:r[a]||nowT()}],o=>{const x=S.att[T]||(S.att[T]={in:"",out:"",off:false});x[a]=o.t},r[a]?()=>{S.att[T][a]="";const x=S.att[T];if(!x.in&&!x.out&&!x.off)delete S.att[T]}:null)}
else if(a==="att")attForm(b.dataset.d,S.att[b.dataset.d]);
else if(a==="addatt")attForm(null,null);
else if(a==="xls"){const q=mr();modal("Export do Excelu",[{k:"from",l:"Od",t:"date",v:q[0]},{k:"until",l:"Do",t:"date",v:q[1]}],o=>{if(o.from&&o.until)exportXls(o.from,o.until)})}
else if(a==="mail"){const q=mr();modal("Poslať dochádzku e-mailom",[{k:"mail",l:"Komu (e-mail)",t:"email",v:S.mail||""},{k:"from",l:"Od",t:"date",v:q[0]},{k:"until",l:"Do",t:"date",v:q[1]}],o=>{S.mail=o.mail;if(o.from&&o.until)mailAtt(o.mail,o.from,o.until)})}
else if(a==="mp"){mon.setMonth(mon.getMonth()-1);render()}
else if(a==="mn"){mon.setMonth(mon.getMonth()+1);render()}
});
$("fab").onclick=()=>{if(tab==="ulohy")taskForm();else if(tab==="postrehy")noteForm();else recForm()};
function toast(t){const e=$("ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),3500)}
function mr(){const y=mon.getFullYear(),m=mon.getMonth();return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))]}
const attRows=(f,t)=>Object.keys(S.att).filter(d=>d>=f&&d<=t).sort().map(d=>({d,r:S.att[d],m:workedMin(d)}));
const h2=m=>Math.round(m/60*100)/100;
function loadXL(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportXls(f,t){
const rows=attRows(f,t);
if(!rows.length){toast("V tomto období nie sú žiadne záznamy.");return}
try{await loadXL()}catch(e){toast("Nepodarilo sa načítať knižnicu pre Excel.");return}
const data=[["Deň","Príchod","Odchod"]];
rows.forEach(x=>data.push([cap(wd(x.d))+" "+D(x.d).toLocaleDateString("sk-SK"),x.r.off?"voľno":(x.r.in||""),x.r.off?"":(x.r.out||"")]));
const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(data);
ws["!cols"]=[{wch:22},{wch:10},{wch:10}];
XLSX.utils.book_append_sheet(wb,ws,"Dochádzka");
const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
try{await saveFile("dochadzka_"+f+"_"+t+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));toast("Export je pripravený.")}catch(e){toast("Export sa nepodaril.")}
}
function mailAtt(to,f,t){
const rows=attRows(f,t);
if(!rows.length){toast("V tomto období nie sú žiadne záznamy.");return}
const sd=d=>D(d).toLocaleDateString("sk-SK");
const body=rows.map(x=>short(x.d)+": "+(x.r.off?"voľno":(x.r.in||"--:--")+" – "+(x.r.out||"--:--"))).join("\n");
const a=document.createElement("a");
a.href="mailto:"+to+"?subject="+encodeURIComponent("Dochádzka Kubišta")+"&body="+encodeURIComponent(body);
a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
toast("Otváram e-mailovú aplikáciu…");
}
async function saveFile(name,blob){
try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==="declined")return}
try{const file=new File([blob],name,{type:blob.type});
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}}catch(e){}
const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
$("prof").onclick=()=>{modal("Profil",[{k:"name",l:"Vaše meno",v:S.name}],o=>{S.name=o.name});
const w=document.createElement("div");w.className="br";w.innerHTML='<button id="bk">Zálohovať údaje</button><button id="rs">Obnoviť zo zálohy</button>';$("sh").querySelector(".br").before(w);
$("bk").onclick=()=>saveFile("dennik-zaloha-"+TODAY()+".json",new Blob([JSON.stringify(S)],{type:"application/json"}));
$("rs").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d||typeof d!=="object")throw 0;S=Object.assign({name:"",recs:[],tasks:[],notes:[],att:{}},d);save();close();render();toast("Údaje obnovené.")}catch(e){toast("Súbor sa nepodarilo načítať.")}};i.click()}};
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
render();
